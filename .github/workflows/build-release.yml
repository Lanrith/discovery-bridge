name: Qualified component build
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          check-latest: false
      - name: Validate candidate version and source
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          go run ./cmd/release-tools release-prepare --version "$version"

  qualify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      save_artifacts: true

  assemble:
    needs: [prepare, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          check-latest: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qualified-*
          path: dist/qualified
      - name: Assemble qualified release assets and image index
        run: |
          make tools
          dist/release-tools release-assemble --version "$RELEASE_VERSION" \
            --source-commit "$GITHUB_SHA" \
            --qualification-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --input dist/qualified --output dist/release --layout dist/release-index
          (cd dist/release && sha256sum --check SHA256SUMS)
      - name: Publish the exact qualified OCI index
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes skopeo
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/discovery-bridge-registry.json"
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy --all --preserve-digests \
            oci:dist/release-index:release "docker://ghcr.io/lanrith/discovery-bridge:v$RELEASE_VERSION"
          dist/release-tools verify-registry --release dist/release
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact-id }}
          path: release
          merge-multiple: true
      # This fresh runner never executes the downloaded artifacts or source.
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - id: image
        run: |
          python3 - <<'PYIMAGE'
          import json, os, re
          value=json.load(open('release/release.json'))['image']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}',value['digest'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream: stream.write('digest='+value['digest']+'\n')
          PYIMAGE
      - id: image-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/lanrith/discovery-bridge
          subject-digest: ${{ steps.image.outputs.digest }}
      - name: Keep the OCI bundle
        env:
          BUNDLE: ${{ steps.image-provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" release/image.intoto.jsonl
      - name: Keep offline verification bundles beside each subject
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          for file in release/*; do [[ "$file" == *.intoto.jsonl ]] || cp "$BUNDLE" "$file.intoto.jsonl"; done
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attested-release
          path: release/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: attest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.attest.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - name: Publish immutable qualified assets
        run: |
          gh release create "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Lanrith Discovery Bridge $RELEASE_VERSION" --generate-notes release/*
